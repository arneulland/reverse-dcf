<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor | Torghatten Academy</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03060E">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/tc.css">
<link rel="stylesheet" href="/academy/academy.css">
<style>
main.edit{max-width:980px}
.edit .top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px;position:sticky;top:0;z-index:5;padding:12px 0;background:linear-gradient(180deg,var(--night) 80%,transparent)}
.edit .top h1{font-size:30px;margin-top:8px}
.edit .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.edit select,.edit input,.edit textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:rgba(5,10,22,.7);padding:9px 11px;font:15px/1.45 var(--body);color:var(--ink)}
.edit .ctl select{width:auto}
.edit textarea{resize:vertical}
.edit input:focus,.edit textarea:focus,.edit select:focus{outline:0;border-color:var(--glow)}
.state{font-size:13px;color:var(--muted);margin-top:4px}
.state.dirty{color:#F2C46D}
.state.ok{color:var(--glow)}
.state a{color:var(--glow)}
.errs{margin-top:12px;padding:14px 16px;border:1px solid rgba(255,156,133,.6);border-radius:12px;background:rgba(255,156,133,.08);font-size:14px}
.errs ul{margin:6px 0 0;padding-left:18px}
.sec-e{margin-top:34px}
.sec-e h2{font-size:24px;margin-bottom:12px}
.sec-e h2 small{display:block;font:400 13px/1.4 var(--body);color:var(--muted);margin-top:4px}
.card{border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01))}
.card .card{background:rgba(5,10,22,.4)}
.card.row{display:flex;gap:10px;align-items:flex-start}
.card.row .g3{flex:1}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ch b{font-family:var(--display);font-size:17px}
.acts{display:flex;gap:4px}
.acts button,.x,.tb button{border:1px solid var(--line);background:transparent;border-radius:8px;padding:4px 9px;cursor:pointer;font-size:13px;color:var(--ink)}
.acts button:hover,.tb button:hover,.x:hover{border-color:var(--glow)}
.f{margin-top:12px}
.f label{display:block;font-size:13.5px;margin-bottom:5px}
.f label small{color:var(--muted);font-size:12px;margin-left:4px}
.g2{display:grid;gap:0 14px}
.g3{display:grid;gap:0 12px}
@media(min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1.3fr 1.3fr}}
.opt{display:flex;gap:8px;align-items:center;margin-top:6px}
.opt input[type=radio]{width:18px;height:18px;flex:none;accent-color:var(--glow)}
.add{margin-top:12px;border:1px dashed rgba(var(--glow-rgb),.6);background:transparent;color:var(--glow);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.add.sm{padding:5px 10px;font-size:13px;margin-top:8px}
.rte{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:8px;border-bottom:1px solid var(--line);background:rgba(5,10,22,.6);position:sticky;top:70px;z-index:2}
.tb .r{margin-left:auto}
.tb button.on{background:var(--glow);color:#06120B}
.rte .ed{padding:6px 16px 18px;min-height:140px;outline:0;font-size:17px}
.rte .raw{border:0;border-radius:0;font:13px/1.5 ui-monospace,Menlo,monospace}
.note{color:var(--muted);font-size:13.5px;margin-top:8px}
.editfab{display:none}
</style>
</head>
<body data-accent="green">
<main class="ac edit">
  <div id="tc-top" data-nav></div>
  <script src="/assets/tc.js"></script>
  <div id="editor"><p class="note">Loading…</p></div>
</main>
<script src="/academy/edit/edit.js"></script>
</body>
</html>
