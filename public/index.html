<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reverse DCF | Torghatten Capital</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20160%20160%22%3E%3Crect%20width%3D%22160%22%20height%3D%22160%22%20rx%3D%2230%22%20fill%3D%22%2314202B%22/%3E%3Cg%20transform%3D%22translate%2820%2052%29%22%3E%3Cg%20transform%3D%22translate%280.0%200.0%29%20scale%281.0%29%20translate%280%20-28.0%29%22%3E%3Cpath%20d%3D%22M6%2076%20C10%2072%2018%2062%2026%2054%20C32%2047%2040%2040%2050%2036%20C58%2033%2070%2032%2078%2036%20C85%2040%2090%2046%2095%2052%20C100%2058%20108%2067%20114%2076%20Z%20M52%2054%20a8%208%200%201%200%2016%200%20a8%208%200%201%200%20-16%200%20Z%22%20fill%3D%22%23FFFFFF%22%20fill-rule%3D%22evenodd%22/%3E%3Crect%20x%3D%222%22%20y%3D%2280.5%22%20width%3D%22116%22%20height%3D%223%22%20fill%3D%22%23E8913A%22/%3E%3C/g%3E%3C/g%3E%3C/svg%3E">
<meta name="description" content="Work backwards from today's share price to the growth it already assumes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --surface:#F6F1E8; --ink:#14202B; --muted:#5A6570; --line:#E2DCCF;
  --accent:#14202B; --accent-soft:#EFE8DA; --brand:#E8913A; --mark:#E8913A; --mark-text:#BD650F; --neg:#A9B0B6;
  --display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14202B; --surface:#1C2B39; --ink:#F6F1E8; --muted:#A3ADB5; --line:#2D3E4E;
    --accent:#F6F1E8; --accent-soft:#26394A; --brand:#E8913A; --mark:#E8913A; --mark-text:#E8913A; --neg:#5B6B79;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:20px 16px 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.brand{display:block;color:var(--ink);line-height:0}
.brand svg{height:40px;width:auto;display:block;margin-left:-4px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.intro h1{font-size:clamp(30px,8vw,46px);max-width:14ch}
.intro p{color:var(--muted);margin-top:12px;max-width:52ch}
.intro.compact h1{font-size:20px;max-width:none}
.intro.compact p{display:none}

.search{position:relative;margin-top:20px}
.search input{width:100%;padding:14px 16px;border:1.5px solid var(--ink);border-radius:10px;background:var(--bg);font-size:17px}
.search input::placeholder{color:var(--muted)}
.suggest{position:absolute;z-index:5;left:0;right:0;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);border-radius:10px;margin:0;padding:4px;list-style:none;box-shadow:0 12px 28px rgba(16,38,46,.16)}
.suggest li{padding:10px 12px;border-radius:7px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.suggest li[aria-selected="true"],.suggest li:hover{background:var(--accent-soft)}
.suggest .sym{font-weight:600}
.suggest .ex{color:var(--muted);font-size:13px;white-space:nowrap}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center;font-size:14px;color:var(--muted)}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px}
.chip:hover{border-color:var(--ink)}
.linkbtn{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:14px}
.notice{margin-top:14px;padding:12px 14px;border-left:3px solid var(--mark);background:var(--surface);border-radius:0 8px 8px 0;font-size:14px}
.status{margin-top:16px;color:var(--muted);font-size:14px}

.company{margin-top:32px;padding-top:20px;border-top:3px solid var(--brand)}
.company h2{font-size:24px}
.company .sub{color:var(--muted);font-size:14px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 20px;margin-top:18px}
@media(min-width:560px){.facts{grid-template-columns:repeat(4,1fr)}}
.fact dt{font-size:13px;color:var(--muted)}
.fact dd{margin:2px 0 0;font-family:var(--display);font-size:20px;font-weight:600}
.fact input{width:100%;border:0;border-bottom:1.5px dashed var(--muted);background:transparent;font-family:var(--display);font-size:20px;font-weight:600;padding:0 0 1px;border-radius:0}
.fact small{display:block;font-size:12px;color:var(--muted);font-family:var(--body);font-weight:400}

.answer{margin-top:36px}
.answer .lead{font-family:var(--display);font-size:19px;font-weight:500}
.answer .big{font-family:var(--display);font-weight:700;font-size:clamp(56px,19vw,104px);line-height:.95;letter-spacing:-.02em;color:var(--mark-text);margin:6px 0 8px}
.answer .big small{font-size:.3em;letter-spacing:-.01em;font-weight:600;color:var(--ink);margin-left:.25em}
.answer .tail{font-size:17px;max-width:46ch}
.answer .need{margin-top:10px;color:var(--muted);font-size:15px;max-width:54ch}

.ruler{position:relative;margin-top:30px;height:150px}
.ruler .axis{position:absolute;left:0;right:0;top:54px;height:2px;background:var(--ink)}
.ruler .tick{position:absolute;top:56px;width:1px;height:6px;background:var(--muted)}
.ruler .ticklab{position:absolute;top:64px;transform:translateX(-50%);font-size:11px;color:var(--muted)}
.ruler .pin{position:absolute;transform:translateX(-50%)}
.ruler .pin.implied{top:0;text-align:center;white-space:nowrap}
.ruler .pin.implied b{display:block;font-family:var(--display);font-size:14px;font-weight:600}
.ruler .pin.implied i{display:block;width:14px;height:14px;background:var(--mark);transform:rotate(45deg);margin:22px auto 0;border:2px solid var(--bg)}
.ruler .dot{position:absolute;top:49px;width:12px;height:12px;border-radius:50%;transform:translateX(-50%);border:2px solid var(--bg);background:var(--accent)}
.ruler .dot.hist{background:var(--ink);border-radius:2px}
.ruler .lab{position:absolute;font-size:12.5px;white-space:nowrap;padding:0 2px}
.ruler .lab::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:5px}
.ruler .lab.hist::before{background:var(--ink);border-radius:1px}
.ruler .stem{position:absolute;width:1px;background:var(--line);top:61px}

section.block{margin-top:44px}
section.block>h3{font-size:19px;margin-bottom:4px}
section.block>.hint{color:var(--muted);font-size:14px;margin-bottom:16px;max-width:60ch}

.controls{display:grid;gap:18px}
@media(min-width:560px){.controls{grid-template-columns:1fr 1fr;gap:20px 32px}}
.ctl label{display:flex;justify-content:space-between;font-size:14px}
.ctl output{font-weight:600;font-family:var(--display);font-size:16px}
.ctl input[type=range]{width:100%;accent-color:var(--brand);margin:8px 0 0;height:24px}
.ctl .note{font-size:12.5px;color:var(--muted);margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:18px}
.check input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.check span small{display:block;color:var(--muted);font-size:12.5px}

.chartwrap{position:relative;background:var(--surface);border-radius:12px;padding:14px 10px 6px}
.chartwrap svg{display:block;width:100%}
.chartwrap text{font-family:var(--body);fill:var(--muted);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);z-index:3}
.record{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;margin-bottom:16px}
details{margin-top:10px;font-size:14px}
summary{cursor:pointer;text-decoration:underline}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td input{width:56px;text-align:right;border:1px solid var(--muted);border-radius:6px;background:var(--bg);padding:5px 6px}
tr.priced td{font-weight:600}
tr.priced td:first-child::before,.key::before{content:"";display:inline-block;width:8px;height:8px;background:var(--mark);transform:rotate(45deg);margin-right:7px}
td.ret{font-family:var(--display);font-weight:600;font-size:16px}
#scen th{white-space:normal;vertical-align:bottom}
@media(max-width:480px){#scen{font-size:13px}#scen th,#scen td{padding:8px 4px}#scen td input{width:44px;padding:5px 4px}td.ret{font-size:14px}}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink)}
.summary{margin-top:14px;padding:14px 16px;background:var(--surface);border-radius:12px;font-size:15px;white-space:pre-wrap}
footer{margin-top:56px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer p+p{margin-top:8px}
footer a{color:inherit}
@media (prefers-reduced-motion:no-preference){.answer .big{transition:color .2s}}
</style>
</head>

      <button type="button" data-lang="no" aria-pressed="false">NO</button>

  <header class="intro" id="intro">
    <h1 data-i18n="h1"></h1>
    <p data-i18n="introP"></p>
  </header>

  <div class="search">
    <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="suggest" aria-autocomplete="list">
    <ul class="suggest" id="suggest" role="listbox" hidden></ul>
  </div>
  <div class="quick">
    <span data-i18n="try"></span>
    <button class="chip" type="button" data-sym="CSU.TO">CSU.TO</button>
    <button class="chip" type="button" data-sym="MSFT">MSFT</button>

  <div id="result" hidden>
    <section class="company">
      <h2 id="cName"></h2>
      <div class="sub" id="cSub"></div>
      <dl class="facts">
        <div class="fact"><dt><label for="inPrice" data-i18n="price"></label></dt><dd><input id="inPrice" inputmode="decimal"><small id="priceNote"></small></dd></div>
        <div class="fact"><dt><label for="inF0" data-i18n="fcfps"></label></dt><dd><input id="inF0" inputmode="decimal"><small id="f0Note"></small></dd></div>
        <div class="fact"><dt data-i18n="multiple"></dt><dd id="fMult"></dd></div>
        <div class="fact"><dt data-i18n="yield"></dt><dd id="fYield"></dd></div>
      </dl>
      <div class="notice" id="warn" hidden></div>

      <p class="lead" id="aLead"></p>
      <p class="big" id="aBig"></p>
      <p class="tail" id="aTail"></p>
      <p class="need" id="aNeed"></p>
      <p class="need" id="aSplit"></p>
      <div class="ruler" id="ruler" aria-hidden="true"></div>
    </section>

    <section class="block">
      <h3 data-i18n="assumeH"></h3>
      <p class="hint" data-i18n="assumeP"></p>
      <div class="controls">
        <div class="ctl"><label for="rR"><span data-i18n="cReturn"></span><output id="oR"></output></label><input id="rR" type="range" min="4" max="20" step="0.5"></div>
        <div class="ctl"><label for="rM"><span id="cMultLab"></span><output id="oM"></output></label><input id="rM" type="range" min="5" max="50" step="1"><div class="note" id="mNote"></div></div>
        <div class="ctl"><label for="rN"><span data-i18n="cYears"></span><output id="oN"></output></label><input id="rN" type="range" min="3" max="15" step="1"></div>

        <div class="fact"><dt data-i18n="hRange"></dt><dd id="hRange"></dd></div>
      </dl>
      <div class="chartwrap" id="chartwrap"><svg id="chart" role="img"></svg><div class="tip" id="tip" hidden></div></div>
      <details><summary data-i18n="showTable"></summary><div class="scroll"><table id="histTable"></table></div></details>
    </section>

    <section class="block">
      <h3 data-i18n="scenH"></h3>

<script id="model">
// ---- Valuation model (pure functions; unit-tested in test/run.js) ------------
// Value today = dividends paid along the way + the price in year N, discounted
// at the return you require. Buybacks are not a cash flow here: they show up as
// faster growth per share.
function presentValue(f0, g, r, m, n, payout) {
  let v = 0, f = f0;
  for (let t = 1; t <= n; t++) { f *= 1 + g; v += (payout * f) / Math.pow(1 + r, t); }
  return v + (f * m) / Math.pow(1 + r, n);
}
function bisect(fn, lo, hi) {
  let flo = fn(lo), fhi = fn(hi);
  if (!isFinite(flo) || !isFinite(fhi) || flo * fhi > 0) return null;
  for (let i = 0; i < 80; i++) {
    const mid = (lo + hi) / 2, fm = fn(mid);
    if (flo * fm <= 0) { hi = mid; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}
// Growth in FCF per share that makes the value equal today's price.
function impliedGrowth(price, f0, r, m, n, payout) {
  if (!(price > 0) || !(f0 > 0) || !(m > 0)) return null;
  return bisect((g) => presentValue(f0, g, r, m, n, payout) - price, -0.6, 2);
}
// Annual return if you pay today's price and the scenario plays out.
function scenarioReturn(price, f0, g, m, n, payout) {
  if (!(price > 0) || !(f0 > 0) || !(m > 0)) return null;
  return bisect((r) => presentValue(f0, g, r, m, n, payout) - price, -0.9, 5);
}
function futurePrice(f0, g, m, n) { return f0 * Math.pow(1 + g, n) * m; }
function cagr(a, b, years) { return a > 0 && b > 0 && years > 0 ? Math.pow(b / a, 1 / years) - 1 : null; }
if (typeof module !== "undefined") module.exports = { presentValue, impliedGrowth, scenarioReturn, futurePrice, cagr };
</script>

  if (S.example) { out.hist = S.example.hist; return out; }

  });
  if (d.ttm) out.ttmPs = perShare(d.ttm) * d.fx;

    const b = rows[rows.length - 1];

  if ($("result").hidden) return;

  $("cName").textContent = d ? d.name : ex ? ex.name : t("manualName");
  $("cSub").textContent = d ? [d.symbol, d.exchange, d.currency].filter(Boolean).join(", ") : ex ? [ex.symbol, ex.exchange, ex.currency].join(", ") + ". " + t(ex.note) : "";
  $("priceNote").textContent = S.priceManual && d ? t("edited") : d && d.priceTime ? t("priceAsOf", { d: dateFmt(d.priceTime) }) : S.cur;
  let f0n = t("yourNumber");
  if (d && d.ttm && !S.f0Manual) {
    f0n = t(d.ttm.isAnnual ? "lastFy" : "ttm", { d: dateFmt(d.ttm.asOf) });
    if (d.finCurrency !== d.currency && !d.warnings.includes("fx_unavailable")) f0n += ". " + t("converted", { fin: d.finCurrency, cur: d.currency, fx: num(d.fx, 3) });
  }
  $("f0Note").textContent = f0n;

  const warns = [];
  if (d) {
    if (d.warnings.includes("no_fundamentals")) warns.push(t("wNoFund"));
    if (d.warnings.includes("fx_unavailable")) warns.push(t("wFx", { fin: d.finCurrency, cur: d.currency }));
    if (d.warnings.includes("ttm_is_last_fiscal_year")) warns.push(t("wFy"));
  }
  $("warn").hidden = !warns.length; $("warn").textContent = warns.join(" ");

  const P = S.price, F = S.f0, r = S.r / 100, pay = S.d / 100;
  const multNow = P > 0 && F > 0 ? P / F : null;
  $("fMult").textContent = mx(multNow, multNow && multNow < 20 ? 1 : 0);
  $("fYield").textContent = multNow ? pct(1 / multNow, 1) : t("na");

  // answer
  const g = impliedGrowth(P, F, r, S.m, S.n, pay);
  $("aLead").textContent = t("lead", { price: money(P) });
  if (g == null) {
    $("aBig").textContent = "";
    $("aTail").textContent = t("negF");
    $("aNeed").textContent = "";
    $("aSplit").textContent = "";
  } else {
    $("aBig").innerHTML = "";
    $("aBig").append(pct(g, 1));
    const sm = document.createElement("small"); sm.textContent = t("perYear"); $("aBig").append(sm);
    $("aTail").textContent = g < 0
      ? t("negG", { g: pct(g, 1), n: S.n })
      : t("tail", { n: S.n, r: pct(r, r * 100 % 1 ? 1 : 0), m: mx(S.m), y });
    const mEff = multNow ? Math.pow(S.m / multNow, 1 / S.n) - 1 : 0;
    const dEff = r - ((1 + g) * (1 + mEff) - 1);
    const sg = (v) => (v < -0.0005 ? "\u2212" : "+") + pct(Math.abs(v), 1);
    $("aSplit").textContent = t("split", { r: pct(r, 1), g: pct(g, 1), m: sg(mEff), now: mx(multNow, 1), then: mx(S.m), d: sg(dEff) });
    $("aNeed").textContent = g <= 0 ? "" : pay >= 1 ? t("needAll") : t("needReinvest", { k: pct(1 - pay), roi: pct(g / (1 - pay), 0) });
  }

  // controls
  $("oR").textContent = pct(r, 1); $("oM").textContent = mx(S.m); $("oN").textContent = S.n; $("oD").textContent = pct(pay);
  $("cMultLab").textContent = t("cMult", { y });
  $("mNote").textContent = !multNow ? "" : dv.range
    ? t("mNote", { now: mx(multNow), from: dv.range.from, lo: mx(dv.range.lo), hi: mx(dv.range.hi) })
    : t("mNoteShort", { now: mx(multNow) });
  const hasSbc = !!(d && d.ttm && d.ttm.sbc > 0);
  $("sbcWrap").hidden = !hasSbc;
  if (hasSbc) $("sbcNote").textContent = t("sbcNote", { v: big(d.ttm.sbc, d.finCurrency), p: d.ttm.fcf > 0 ? pct(d.ttm.sbc / d.ttm.fcf) : t("na") });

  // history
  const showHist = dv.rows.length > 0 || !!dv.hist;
  $("histBlock").hidden = !showHist;
  if (showHist) {
    $("histP").textContent = dv.rows.length ? t("histP", { cur: d.finCurrency }) : "";
    $("hCagrLab").textContent = dv.hist ? t("hCagr", { a: dv.hist.from, b: dv.hist.to }) : t("hCagrNone");
    $("hCagr").textContent = dv.hist ? pct(dv.hist.cagr, 1) : t("na");
    $("hRange").textContent = dv.range ? mx(dv.range.lo) + " – " + mx(dv.range.hi) : t("na");
    $("chartwrap").hidden = !dv.rows.length;
    $("histTable").parentElement.parentElement.hidden = !dv.rows.length;
    if (dv.rows.length) { drawChart(dv); drawTable(dv); }
  }

  // scenarios
  $("sPriceH").textContent = t("sPrice", { y }) + ", " + S.cur;
  const plain = (v) => num(v, v >= 1000 ? 0 : 2);
  const res = {};
  document.querySelectorAll("#scen tr[data-s]").forEach((tr) => {
    const sc = S.scen[tr.dataset.s];
    const ret = scenarioReturn(P, F, sc.g / 100, sc.m, S.n, pay);
    const px = F > 0 ? futurePrice(F, sc.g / 100, sc.m, S.n) : null;
    res[tr.dataset.s] = { ret, px };
    tr.querySelector(".ret").textContent = pct(ret, 1);
    tr.querySelector(".px").textContent = px ? plain(px) : t("na");
  });
  $("pG").textContent = pct(g, 1); $("pM").textContent = mx(S.m); $("pR").textContent = g == null ? t("na") : pct(r, 1);
  const pp = g == null ? null : futurePrice(F, g, S.m, S.n);
  $("pP").textContent = pp ? plain(pp) : t("na");

  drawRuler(g, dv.hist);
  $("summary").textContent = buildSummary(g, multNow, dv.hist, res, pp, y);

  const fl = $("footLink");
  fl.hidden = !SUBSTACK_URL;
  if (SUBSTACK_URL) { fl.innerHTML = ""; const a = document.createElement("a"); a.href = SUBSTACK_URL; a.textContent = "Torghatten Capital"; fl.append(a); $("brand").href = SUBSTACK_URL; }
}

function buildSummary(g, multNow, hist, res, pp, y) {
  if (g == null) return "";
  const sym = (S.data && S.data.symbol.split(".")[0]) || (S.example && "CSU") || "";
  const sc = S.scen, lines = [];
  lines.push(t("sumA", { sym, price: money(S.price), mult: mx(multNow), yld: pct(1 / multNow, 1) }).replace(/^\$ /, ""));
  lines.push(t("sumB", { r: pct(S.r / 100, S.r % 1 ? 1 : 0), m: mx(S.m), y, g: pct(g, 1), n: S.n }));
  if (hist) lines.push(t("sumC", { h: pct(hist.cagr, 0), a: hist.from, b: hist.to }));
  lines.push(t("sumD", { bg: pct(sc.bear.g / 100), bm: mx(sc.bear.m), br: pct(res.bear.ret, 0), sg: pct(sc.base.g / 100), sm: mx(sc.base.m), sr: pct(res.base.ret, 0), ug: pct(sc.bull.g / 100), um: mx(sc.bull.m), ur: pct(res.bull.ret, 0) }));
  lines.push(t("sumE", { y, bp: money(res.bear.px), pp: money(pp), sp: money(res.base.px), up: money(res.bull.px), price: money(S.price) }));
  return lines.join("\n\n");
}

// One axis: growth per year. The diamond is what the price assumes; the dots
// are the track record and the three scenarios.
function drawRuler(g, hist) {
  const el = $("ruler");
  el.innerHTML = "";
  if (g == null) { el.hidden = true; return; }
  el.hidden = false;
  const items = [
    hist ? { v: hist.cagr * 100, label: t("history") + " " + pct(hist.cagr, 0), cls: "hist" } : null,
    { v: S.scen.bear.g, label: t("bear") + " " + pct(S.scen.bear.g / 100), cls: "" },
    { v: S.scen.base.g, label: t("base") + " " + pct(S.scen.base.g / 100), cls: "" },
    { v: S.scen.bull.g, label: t("bull") + " " + pct(S.scen.bull.g / 100), cls: "" },
  ].filter(Boolean);
  const vals = items.map((i) => i.v).concat([g * 100, 0]);
  let lo = Math.floor(Math.min(...vals) / 5) * 5, hi = Math.ceil((Math.max(...vals) + 0.5) / 5) * 5;
  lo = Math.max(lo, -60); hi = Math.min(Math.max(hi, lo + 10), 80);
  const W = el.clientWidth, pad = 14;
  const x = (v) => pad + ((clamp(v, lo, hi) - lo) / (hi - lo)) * (W - 2 * pad);
  const add = (cls, style, text) => { const n = document.createElement("div"); n.className = cls; Object.assign(n.style, style); if (text != null) n.textContent = text; el.append(n); return n; };
  add("axis", {});
  const step = hi - lo > 40 ? 10 : 5;
  for (let v = lo; v <= hi; v += step) { add("tick", { left: x(v) + "px" }); add("ticklab", { left: x(v) + "px" }, pct(v / 100)); }
  const pin = add("pin implied", { left: x(g * 100) + "px" });
  const b = document.createElement("b"); b.textContent = t("pricedIn") + " " + pct(g, 1); pin.append(b, document.createElement("i"));
  const pw = pin.offsetWidth / 2, px = x(g * 100);
  if (px - pw < 0) b.style.transform = `translateX(${pw - px}px)`;
  if (px + pw > W) b.style.transform = `translateX(${W - px - pw}px)`;
  // labels below the axis, stacked into rows so they never overlap
  const rows = [];
  items.sort((a, c) => a.v - c.v).forEach((it) => {
    add("dot " + it.cls, { left: x(it.v) + "px" });
    const lab = add("lab " + it.cls, { left: "0px", top: "0px" }, it.label);
    const w = lab.offsetWidth;
    const left = clamp(x(it.v) - w / 2, 0, W - w);
    let row = 0;
    while (rows[row] != null && rows[row] > left - 6) row++;
    rows[row] = left + w;
    lab.style.left = left + "px";
    lab.style.top = 84 + row * 20 + "px";
    add("stem", { left: x(it.v) + "px", height: 84 + row * 20 - 61 + "px" });
  });
  el.style.height = 84 + rows.length * 20 + 6 + "px";
}

function drawChart(dv) {
  const svg = $("chart"), wrap = $("chartwrap"), d = S.data;
  const bars = dv.rows.map((r) => ({ label: String(r.year), v: r.ps, ttm: false }));
  if (d.ttm && !d.ttm.isAnnual) bars.push({ label: S.lang === "no" ? "12 md" : "TTM", v: perShare(d.ttm), ttm: true });
  const W = wrap.clientWidth - 20, H = 200, L = 44, R = 6, T = 10, B = 24;
  const max = Math.max(0, ...bars.map((b) => b.v)), min = Math.min(0, ...bars.map((b) => b.v));
  const span = max - min || 1;
  const yv = (v) => T + ((max - v) / span) * (H - T - B);
  const bw = (W - L - R) / bars.length, w = Math.max(3, Math.min(34, bw - 2));
  const css = getComputedStyle(document.documentElement);
  const c = (n) => css.getPropertyValue(n).trim();
  let h = "";
  const nice = (v) => { const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f >= 5 ? 5 : f >= 2 ? 2 : 1) * p; };
  const stepY = nice(span / 3);
  for (let v = Math.ceil(min / stepY) * stepY; v <= max + 1e-9; v += stepY) {
    h += `<line x1="${L}" x2="${W - R}" y1="${yv(v)}" y2="${yv(v)}" stroke="${c("--line")}" stroke-width="${Math.abs(v) < 1e-9 ? 1.5 : 1}"/>`;
    h += `<text x="${L - 6}" y="${yv(v) + 4}" text-anchor="end">${num(v, stepY < 1 ? 2 : stepY < 10 ? 1 : 0)}</text>`;
  }
  const every = Math.ceil(bars.length / Math.max(1, Math.floor((W - L - R) / 34)));
  bars.forEach((b, i) => {
    const cx = L + bw * i + bw / 2, y0 = yv(0), y1 = yv(b.v), top = Math.min(y0, y1), hh = Math.max(1, Math.abs(y1 - y0));
    const rr = Math.min(4, w / 2, hh);
    const path = b.v >= 0
      ? `M${cx - w / 2},${y0}V${top + rr}q0,-${rr} ${rr},-${rr}h${w - 2 * rr}q${rr},0 ${rr},${rr}V${y0}z`
      : `M${cx - w / 2},${y0}V${y1 - rr}q0,${rr} ${rr},${rr}h${w - 2 * rr}q${rr},0 ${rr},-${rr}V${y0}z`;
    const fill = b.v < 0 ? c("--neg") : b.ttm ? c("--mark") : c("--accent");
    h += `<path d="${path}" fill="${fill}"/>`;
    h += `<rect class="hit" data-i="${i}" x="${L + bw * i}" y="${T}" width="${bw}" height="${H - T - B}" fill="transparent"/>`;
    if (b.ttm || (bars.length - 1 - i) % every === 0)
      h += `<text x="${cx}" y="${H - 7}" text-anchor="middle">${b.ttm || bars.length <= 8 ? b.label : "’" + b.label.slice(2)}</text>`;
  });
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  svg.setAttribute("aria-label", t("histP", { cur: d.finCurrency }));
  svg.innerHTML = h;
  const tip = $("tip");
  const showTip = (e) => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i == null) { tip.hidden = true; return; }
    const b = bars[i];
    tip.textContent = b.label + ": " + money(b.v, d.finCurrency);
    tip.hidden = false;
    const cx = 10 + L + bw * i + bw / 2;
    tip.style.left = clamp(cx, 60, W - 40) + "px";
    tip.style.top = 14 + Math.min(yv(b.v), yv(0)) - 4 + "px";
  };
  svg.onpointermove = showTip; svg.onpointerdown = showTip; svg.onpointerleave = () => (tip.hidden = true);
}
function drawTable(dv) {
  const d = S.data, fc = d.finCurrency;
  let h = `<thead><tr><th>${t("tYear")}</th><th>${t("tFcf")}</th><th>${t("tShares")}</th><th>${t("tPs")}</th><th>${t("tPx")}</th><th>${t("tMult")}</th></tr></thead><tbody>`;
  for (const r of dv.rows)
    h += `<tr><td>${r.year}</td><td>${big(r.fcf - (S.sbc && r.sbc ? r.sbc : 0), fc)}</td><td>${num(r.shares / 1e6, 1)}m</td><td>${money(r.ps, fc)}</td><td>${r.price ? money(r.price, d.currency) : t("na")}</td><td>${mx(r.mult)}</td></tr>`;
  $("histTable").innerHTML = h + "</tbody>";
}

// ---- search ----------------------------------------------------------------
let sugg = [], sel = -1, timer = null, sseq = 0;
function closeSuggest() { $("suggest").hidden = true; $("q").setAttribute("aria-expanded", "false"); sugg = []; sel = -1; }
function drawSuggest() {
  const ul = $("suggest"); ul.innerHTML = "";
  sugg.forEach((s, i) => {
    const li = document.createElement("li");
    li.setAttribute("role", "option"); li.setAttribute("aria-selected", String(i === sel));
    const a = document.createElement("span"); const sy = document.createElement("span"); sy.className = "sym"; sy.textContent = s.symbol;
    a.append(sy, " " + s.name);
    const e = document.createElement("span"); e.className = "ex"; e.textContent = s.exchange;
    li.append(a, e);
    li.onpointerdown = (ev) => { ev.preventDefault(); loadSymbol(s.symbol); };
    ul.append(li);
  });
  ul.hidden = !sugg.length; $("q").setAttribute("aria-expanded", String(!!sugg.length));
}
async function runSearch(q) {
  const my = ++sseq;
  try {
    const { results } = await api("/api/search?q=" + encodeURIComponent(q));
    if (my !== sseq) return;
    sugg = results; sel = -1; drawSuggest();
    $("status").textContent = results.length ? "" : t("nohits", { q });
  } catch (e) { if (my === sseq) { closeSuggest(); $("status").textContent = ""; showApiDown(); } }
}
$("q").addEventListener("input", () => {
  clearTimeout(timer);
  const q = $("q").value.trim();
  if (q.length < 2) { closeSuggest(); return; }
  timer = setTimeout(() => runSearch(q), 250);
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!sugg.length) return;
    e.preventDefault();
    sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + sugg.length) % sugg.length; drawSuggest();
  } else if (e.key === "Enter") {
    e.preventDefault(); clearTimeout(timer);
    const q = $("q").value.trim();
    if (sugg.length) loadSymbol(sugg[Math.max(sel, 0)].symbol);
    else if (/^\$?[A-Za-z0-9][A-Za-z0-9.\-]{0,11}$/.test(q)) loadSymbol(q.replace(/^\$/, "").toUpperCase());
    else if (q) runSearch(q);
  } else if (e.key === "Escape") closeSuggest();
});
$("q").addEventListener("blur", () => setTimeout(closeSuggest, 150));

// ---- inputs ----------------------------------------------------------------
document.querySelectorAll(".chip").forEach((b) => (b.onclick = () => loadSymbol(b.dataset.sym)));
$("manualBtn").onclick = loadManual;
$("inPrice").addEventListener("input", () => { const v = parse($("inPrice").value); if (v != null) { S.price = v; S.priceManual = true; render(); } });
$("inF0").addEventListener("input", () => { const v = parse($("inF0").value); if (v != null) { S.f0 = v; S.f0Manual = true; render(); } });
[["rR", "r"], ["rM", "m"], ["rN", "n"], ["rD", "d"]].forEach(([id, k]) => $(id).addEventListener("input", () => { S[k] = parseFloat($(id).value); render(); }));
$("cSbc").addEventListener("change", () => {
  S.sbc = $("cSbc").checked; S.f0Manual = false;
  S.f0 = derive().ttmPs; $("inF0").value = num(S.f0, 2); render();
});
document.querySelectorAll("#scen tr[data-s] input").forEach((inp) => inp.addEventListener("input", () => {
  const v = parse(inp.value); if (v == null) return;
  S.scen[inp.closest("tr").dataset.s][inp.dataset.k] = v; render();
}));
document.querySelectorAll(".lang button").forEach((b) => (b.onclick = () => {
  S.lang = b.dataset.lang; try { localStorage.setItem("rdcf-lang", S.lang); } catch (e) {}
  render(); if (!$("result").hidden) syncInputs();
}));
function copy(btn, text) {
  const done = () => { const o = btn.textContent; btn.textContent = t("copied"); setTimeout(() => (btn.textContent = o), 1400); };
  try { navigator.clipboard.writeText(text).then(done, () => {}); } catch (e) {}
}
$("copySum").onclick = () => copy($("copySum"), $("summary").textContent);
$("copyLink").onclick = () => copy($("copyLink"), location.origin + location.pathname + (S.data ? "?t=" + encodeURIComponent(S.data.symbol) : ""));
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });

render();
(function boot() {
  let sym = null;
  try { sym = new URLSearchParams(location.search).get("t") || (location.hash.length > 1 ? decodeURIComponent(location.hash.slice(1)) : null); } catch (e) {}
  if (sym && /^[A-Za-z0-9][A-Za-z0-9.\-]{0,14}$/.test(sym)) loadSymbol(sym.toUpperCase());
})();
</script>
